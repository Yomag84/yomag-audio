<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YomagAudio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .card {
        width: calc(100% - 16px);
        height: calc(100% - 16px);
        border-radius: 20px;
        background: radial-gradient(120% 120% at 50% 15%, #16204a 0%, #0a0e1f 60%, #060811 100%);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      .logo {
        width: 230px;
        height: auto;
        filter: drop-shadow(0 8px 24px rgba(70, 120, 255, 0.35));
        animation: rise 0.6s ease-out;
      }

      .dots {
        display: flex;
        gap: 7px;
      }

      .dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5aa8ff;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/splash-logo.png" alt="YomagAudio" />
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </body>
</html>
